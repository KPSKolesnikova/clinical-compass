<script>
(()=>{
 const deck=JSON.parse(document.getElementById('deckData').textContent);
 const sources=new Map(deck.sources.map(s=>[s.id,s]));
 const stage=document.getElementById('stage');
 const escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const maxSteps={hero:0,asis:1,tobe:2,doctor:3,patient:1,contrast:1,medical:2,forecast:1,architecture:3,quality:2,cases:0,tests:1,sources:2,pilot:3,scale:1,editorial:2,evidence:1,instruments:1,dual:1,screen:1,domains:2,signals:2,safety:2,relations:2,dynamics:1,timewindows:2,recommendation:2,limits:2,metrics:2,roadmap:2,references:1};
 const sourceLabel=s=>s.id==='mbc'?'MBC · Zhu 2021':s.id==='item9'?'Пункт 9 · Na 2018':s.id==='kr301'?'КР 301_3':s.id==='kr457'?'КР 457_3':s.id==='phq'?'PHQ-9 · 2001':s.id==='gad'?'GAD-7 · 2006':'Журнал проверок';
 const bullets=s=>`<ul class="bullets">${s.bullets.map((b,i)=>`<li style="--i:${i}">${escape(b)}</li>`).join('')}</ul>`;
 const build=(n,html,classes='')=>`<div class="build ${classes}" data-reveal="${n}">${html}</div>`;
 const shot=(url,alt,extra='')=>`<button class="shot ${extra}" data-image="${escape(url)}" data-caption="${escape(alt)}" aria-label="Увеличить: ${escape(alt)}"><img src="${escape(url)}" alt="${escape(alt)}" loading="eager"/><span class="shot-caption">${escape(alt)} · увеличить<small>Локальный прототип · вымышленные данные</small></span></button>`;
 const stepNodes=(steps,descriptions=[],withConnectors=false)=>`<div class="path-row">${steps.map((st,i)=>`${i&&withConnectors?'<div class="path-connector" aria-hidden="true"></div>':''}<div class="path-node"><span class="step-number">${String(i+1).padStart(2,'0')}</span><strong>${escape(st)}</strong>${descriptions[i]?`<p>${escape(descriptions[i])}</p>`:''}</div>`).join('')}</div>`;
 function visual(s,i){switch(s.kind){
  case 'hero':return `<img class="hero-logo auto" style="--delay:0ms" src="assets/logo.svg" alt="Логотип Клинического Компаса"/><div class="slide-header auto" style="--delay:150ms"><div class="eyebrow">${escape(s.eyebrow)}</div><h1>${escape(s.title)}</h1></div>${bullets(s)}<div class="hero-roles auto" style="--delay:700ms"><span class="role">Пациент</span><span class="between"></span><span>Наблюдение между встречами</span><span class="between"></span><span class="role">Специалист</span></div><p class="deck-tag auto" style="--delay:800ms">Функциональный прототип<br>Маршрут к клиническому пилоту<br>${escape(deck.duration)}</p>`;
  case 'asis':return `<div class="body two-columns">${bullets(s)}<div class="visual asis-map"><svg class="asis-link build" data-reveal="1" viewBox="0 0 1000 480" aria-hidden="true"><line x1="150" y1="85" x2="500" y2="240"/><line x1="840" y1="110" x2="500" y2="240"/><line x1="170" y1="400" x2="500" y2="240"/><line x1="840" y1="380" x2="500" y2="240"/></svg>${s.steps.map((st,j)=>`<div class="fragment auto" style="--delay:${j*140}ms"><span class="small-label">Источник ${j+1}</span><strong>${escape(st)}</strong></div>`).join('')}<div class="asis-center">Ручная<br>сверка</div>${build(1,'Связанная история появляется после сопоставления','final-caption')}</div></div>`;
  case 'tobe':return `<div class="body">${bullets(s)}<div class="tobe-diagram">${stepNodes(s.steps,['Пациент','Проверяемые условия','Основания и вопросы','Решение специалиста'],true)}</div>${build(1,'<span>Следующий контакт продолжает цикл</span>','loop-return')}<div class="tobe-bottom">${build(2,'<b>01</b><span>Одна история наблюдения<br>для следующей встречи</span>','tobe-line')}${build(2,shot(s.image,'Реальное расписание прототипа'))}</div></div>`;
  case 'doctor':return `<div class="body two-columns">${bullets(s)}<div class="visual">${shot(s.image,'Кабинет специалиста · реестр пациентов')}${build(1,'1','focus-dot one')}${build(2,'2','focus-dot two')}${build(3,'3','focus-dot three')}<div class="path-row">${s.steps.map((st,j)=>`<div class="path-node" data-focus="${Math.max(1,j)}"><strong>${String(j+1).padStart(2,'0')} ${escape(st)}</strong></div>`).join('')}</div></div></div>`;
  case 'patient':return `<div class="body">${bullets(s)}<div class="visual"><div class="patient-screens">${shot(s.image,'Кабинет пациента · ежедневная отметка','screen-primary')}${shot(s.secondImage,'Назначенный опросник PHQ-9','screen-secondary')}</div>${stepNodes(s.steps)}</div></div>`;
  case 'contrast':return `<div class="body"><article class="contrast-card"><p class="contrast-title">Случай A · динамика PHQ-9</p><div class="scores"><span>14</span><span class="arrow">→</span><span>9</span><span class="arrow">→</span><span>6</span></div>${build(1,'<p>Есть снижение баллов. Устойчивость и функционирование ещё требуют оценки.</p><span class="status teal">Обсудить закрепление улучшений</span>','contrast-context')}</article><article class="contrast-card"><p class="contrast-title">Случай B · последний PHQ-9</p><div class="scores"><span>7</span><small>из 27</small></div>${build(1,'<p>В анамнезе отмечен подъём активности. Невысокая сумма его не исключает.</p><span class="status amber">Уточнить эпизоды настроения</span>','contrast-context')}<span class="reveal-cue">Контекст раскрывается следующим шагом</span></article>${bullets(s)}</div>`;
  case 'medical':return `<div class="body">${bullets(s)}<div class="visual"><div class="medical-flow"><div class="inputs">${s.steps.map((st,j)=>`<div class="input-node auto" style="--delay:${j*100}ms">${escape(st)}</div>`).join('')}</div><div class="path-connector"></div>${build(1,'<span class="small-label">Прозрачная логика</span><div class="rule"></div><p>Качество записей<br>Временной контекст<br>Сопоставимая динамика</p>','logic-node')}<div class="path-connector build" data-reveal="2"></div>${build(2,'<h3>Сводка</h3><p>Оценка состояния<br>Основания<br>Неопределённость<br>Следующий шаг</p>','output-node')}</div><div class="mini-evidence">${shot(s.image,'Реальная клиническая сводка')}<p>Вывод можно раскрыть<br>до исходного факта и даты.</p></div></div></div>`;
  case 'forecast':return `<div class="body">${bullets(s)}<div class="visual forecast-board"><div class="history-line"><span class="small-label">Наблюдаемые факты</span><svg viewBox="0 0 300 180" role="img" aria-label="Иллюстрация наблюдаемого снижения баллов 14, 9, 6"><path d="M20 155H285" stroke="#c9d9ed" fill="none"/><path class="trace" d="M28 40L150 90L275 120" stroke="#3f5c88" stroke-width="4" fill="none"/>${[[28,40,'14'],[150,90,'9'],[275,120,'6']].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="7" fill="#f8fbff" stroke="#3f5c88" stroke-width="3"/><text x="${p[0]}" y="${p[1]-19}" fill="#3f5c88" text-anchor="middle" font-size="25">${p[2]}</text>`).join('')}</svg><p>Один инструмент.<br>Сопоставимые точки.</p></div><div class="forecast-boundary" aria-hidden="true"></div>${build(1,'<svg viewBox="0 0 100 455" aria-hidden="true"><path d="M0 228H35V62H100M35 228H100M35 228V393H100" stroke="#9ab5d6" stroke-width="2" fill="none" stroke-dasharray="7 7"/></svg>','branch-lines')}${build(1,'<article class="scenario"><h3>Сохранение условий</h3><p>Возможно продолжение<br>наблюдаемого направления.</p></article><article class="scenario"><h3>Благоприятные изменения</h3><p>Устранены барьеры,<br>улучшается функционирование.</p></article><article class="scenario"><h3>Новые факторы</h3><p>Стрессоры и ухудшение<br>могут изменить траекторию.</p></article>','scenario-stack')}<p class="forecast-foot">Будущие числовые баллы и проценты вероятности не рассчитываются.</p></div></div>`;
  case 'architecture':return `<div class="body">${bullets(s)}<div class="visual architecture-stack"><div class="arch-box arch-ui"><span class="small-label">Интерфейсы</span><div>React UI</div><small>Специалист и пациент</small></div><div class="arch-arrow">→</div>${build(1,'<span class="small-label">Обмен</span><div>Next.js API</div><small>Локальный development-контур</small>','arch-box arch-api')}${build(1,'Структурированные записи · память процесса + localStorage','arch-data')}${build(2,'<div>Входные проверки<code>patient-insights.ts</code></div><div>Контекст и связи<code>clinical-synthesis.ts</code></div><div>Состояние и сценарии<code>clinical-support.ts</code></div>','arch-modules')}${build(3,'Объяснимая сводка с основаниями','arch-output')}<p class="arch-target">Следующий этап: постоянное хранилище, роли доступа, аудит и согласованные интеграции.</p></div></div>`;
  case 'quality':return `<div class="body">${bullets(s)}<div class="visual"><div class="quality-checks">${s.steps.map(st=>`<div>${escape(st)}</div>`).join('')}</div><div class="time-axis"><div class="time-event august">Тест в августе<small>Сведения на дату оценки</small></div>${build(1,'Только доступное тогда','time-gate')}<div class="time-event october">Новый результат<small>Октябрь</small></div>${build(2,'Поздняя запись<br>не меняет прошлый вывод','blocked')}</div>${build(2,'Δ = последний балл − первый балл<br><span class="caption">Наблюдаемое изменение. Будущие данные не меняют прошлый вывод.</span>','quality-message')}</div></div>`;
  case 'cases':return `<div class="body">${bullets(s)}<div class="visual case-grid">${s.cases.map((c,j)=>`<article class="case-item auto" style="--delay:${j*80}ms"><span class="num">${String(j+1).padStart(2,'0')}</span><h3>${escape(c[0])}</h3><p>${escape(c[1])}</p></article>`).join('')}</div></div>`;
  case 'tests':return `<div class="body">${bullets(s)}<div class="visual"><div class="metric-row">${s.metrics.map(m=>`<div class="metric"><b>${escape(m[0])}</b><span>${escape(m[1])}</span></div>`).join('')}</div><div class="test-layers"><div class="test-layer"><div><strong>Инженерная проверка</strong><small>Даты, ответы, версии, ограничения</small></div><span class="status teal">47 PASS</span></div><div class="test-layer"><div><strong>Сценарии интерфейса</strong><small>Маршруты, сохранение, интерактивность</small></div><span class="status teal">Проверено вручную</span></div>${build(1,'<div><strong>Клиническая оценка</strong><small>Точность, полезность, последствия</small></div><span class="status neutral">Следующий этап</span>','test-layer')}</div><p class="metrics-caption">Инженерная корректность и клиническая эффективность — разные уровни доказательств.</p></div></div>`;
  case 'sources':return `<div class="body">${bullets(s)}<div class="visual"><div class="trace-path"><div class="trace-step">Входной факт</div><span class="muted">→</span>${build(1,'Правило','trace-step')}<span class="muted">→</span>${build(1,'Рекомендация','trace-step')}<span class="muted">→</span>${build(2,'Источник','trace-step')}</div><div class="source-grid">${s.sources.map(id=>sources.get(id)).filter(Boolean).map(src=>`<a class="source-card auto" href="${escape(src.url)}" target="_blank" rel="noreferrer"><span class="external">↗</span><span class="source-id">${escape(sourceLabel(src))}</span><h3>${escape(src.title)}</h3><p>${escape(src.detail)}</p></a>`).join('')}</div></div></div>`;
  case 'pilot':return `<div class="body">${bullets(s)}<div class="visual"><div class="pilot-road">${s.steps.map((st,j)=>`<article class="pilot-stage build" data-reveal="${j}"><span class="num">${String(j+1).padStart(2,'0')}</span><h3>${escape(st)}</h3><p>${['Согласованный протокол<br>и экспертная разметка','Наблюдение без влияния<br>на клинические решения','Проверка полезности<br>в рабочем процессе','Совместная оценка результатов<br>и готовности эксплуатации'][j]}</p><span class="gate">Критерий: ${['безопасность','согласованность','польза','готовность'][j]}</span></article>`).join('')}</div><p class="pilot-bottom">До старта фиксируются метрики, целевые значения,<br>условия перехода и правила остановки.</p></div></div>`;
  case 'scale':return `<img class="scale-logo auto" src="assets/logo.svg" alt="Логотип Клинического Компаса"/><div class="body">${bullets(s)}<div class="visual"><div class="scale-road">${s.steps.map((st,j)=>`<div class="scale-step ${j?'build':''}" ${j?'data-reveal="1"':''}>${escape(st)}<small>${['Связанный сценарий уже работает','Проверка пользы и надёжности','Общий стандарт с локальными маршрутами'][j]}</small></div>`).join('')}</div>${build(1,'Клиническая площадка.<br>Экспертиза.<br>Совместная инженерная команда.','closing-line')}</div></div>`;

  case 'editorial':case 'domains':case 'relations':case 'recommendation':case 'limits':case 'metrics':return `<div class="expanded-body">${bullets(s)}<div class="flat-rows">${s.rows.map((r,j)=>build(Math.min(j,2),`<h3>${escape(r[0])}</h3><p>${escape(r[1])}</p>`,'flat-row')).join('')}</div>${s.strap?`<p class="strap">${escape(s.strap)}</p>`:''}</div>`;
  case 'evidence':return `<div class="wide-content">${bullets(s)}<div class="evidence-compare"><article><div class="evidence-number">52,8<small>%</small></div><p class="evidence-label">Регулярное измерение и обсуждение</p><div class="data-bar"><span style="width:52.8%"></span></div><p class="evidence-detail">Нескорректированная доля ремиссии<br>в группе MBC.</p></article>${build(1,'<div class="evidence-number">43,0<small>%</small></div><p class="evidence-label">Сравнительные условия</p><div class="data-bar"><span style="width:43%"></span></div><p class="evidence-detail">Разница 9,8 процентного пункта.<br>Показатель внешнего исследования.</p>')}</div><p class="study-context">Zhu et al., 2021: ремиссия в 5 исследованиях, n = 1 518. OR 1,83; 95% ДИ 1,12–2,97.<br>Исследования включали фармакотерапию. Есть неоднородность и риск систематических ошибок.</p></div>`;
  case 'instruments':return `<div class="wide-content">${bullets(s)}<div class="instrument-grid"><article><h2>PHQ-9</h2><div class="evidence-number">88% / 88%</div><p>Чувствительность / специфичность<br>при пороге ≥10.<br>Kroenke et al., 2001.</p></article>${build(1,'<article><h2>GAD-7</h2><div class="evidence-number">89% / 82%</div><p>Чувствительность / специфичность<br>при пороге ≥10.<br>Spitzer et al., 2006.</p></article>')}</div><p class="strap">Характеристики исходных исследований. Перенос на целевую популяцию требует проверки.</p></div>`;
  case 'dual':return `<div class="wide-content">${bullets(s)}<div class="role-pair"><div class="role-view"><h3>Специалист</h3>${shot('assets/doctor-analysis.jpg','Аналитика врача')}</div>${build(1,'<h3>Пациент</h3>'+shot('assets/patient-home.jpg','Кабинет пациента'),'role-view')}</div></div>`;
  case 'screen':return `<div class="expanded-body">${bullets(s)}<div>${shot(s.image,s.caption)}<div class="screen-legend">${s.rows.map(r=>`<div><strong>${escape(r[0])}</strong>${escape(r[1])}</div>`).join('')}</div></div><p class="strap">${escape(s.strap)}</p></div>`;
  case 'signals':return `<div class="expanded-body">${bullets(s)}<div class="signal-list">${s.rows.map((r,j)=>build(Math.min(j,2),`<span class="signal-dot ${r[0]}"></span><div><h3>${escape(r[1])}</h3><p>${escape(r[2])}</p></div>`,'signal-row')).join('')}</div><p class="strap">${escape(s.strap)}</p></div>`;
  case 'safety':return `<div class="expanded-body">${bullets(s)}<div><div class="safety-numbers"><div><div class="evidence-number">87,6%</div><p>Чувствительность<br>пункта 9</p></div><div><div class="evidence-number">28,6%</div><p>PPV относительно<br>критерия eC-SSRS</p></div></div>${build(1,'<div><span>01 Исходный ответ</span>Открыть форму<br>и дату</div><div><span>02 Прямой контакт</span>Уточнить мысли,<br>намерения и контекст</div><div><span>03 Решение</span>Действовать<br>по локальному протоколу</div>','safety-path')}${build(2,'Na et al., 2018, n = 841. Эти числа не являются индивидуальной вероятностью суицида.','study-context')}</div><p class="strap">Автоматического экстренного уведомления в прототипе нет.</p></div>`;
  case 'dynamics':return `<div class="expanded-body">${bullets(s)}<div><div class="trajectory-numbers">14<span>→</span>9<span>→</span>6</div><div class="delta-grid"><div><b>−8 баллов</b><p>Последний результат<br>минус первый.</p></div>${build(1,'<b>−57%</b><p>Наблюдаемое изменение<br>от исходного балла.</p>')}</div><p class="study-context">Серия 14 → 5 → 8 означает колебания,<br>даже если итог ниже исходного значения.</p></div><p class="strap">Клиническую значимость уточняют по функционированию и беседе. MCID и надёжное изменение не рассчитываются.</p></div>`;
  case 'timewindows':return `<div class="wide-content">${bullets(s)}<div>${[['90 дней','Глубина сопоставимой серии','Перед последним результатом шкалы',100],['14 дней','Свежесть в основном движке','Перед датой текущей оценки',65],['7 дней','Рост шкалы и дневник','До результата, включая его дату',35]].map((r,j)=>build(j,`<b>${r[0]}</b><div><div class="timebar"><span style="width:${r[3]}%"></span></div><p>${r[1]}</p></div><small>${r[2]}</small>`,'window-row')).join('')}</div><div class="window-bottom"><p>Направление: ≥2 точек и ≥7 дней.<br>Более содержательная база: ≥3 точек, ≥14 дней, известная форма и свежий результат.</p><p>2–4 недели: условный сценарий.<br>30 дней: резервный организационный интервал между подтверждёнными сессиями.</p></div><p class="strap">Настройки прототипа. Длина полос условная; это не единая медицинская временная шкала.</p></div>`;
  case 'roadmap':return `<div class="expanded-body">${bullets(s)}<div class="roadmap-cols">${s.rows.map((r,j)=>build(j,`<span class="row-num">${String(j+1).padStart(2,'0')}</span><h3>${escape(r[0])}</h3><p>${escape(r[1])}</p>`,'roadmap-col')).join('')}</div><p class="strap">${escape(s.strap)}</p></div>`;
  case 'references':return `<div class="expanded-body">${bullets(s)}<div class="reference-list">${s.sources.map(id=>sources.get(id)).filter(Boolean).map((r,j)=>`<a href="${escape(r.url)}" target="_blank" rel="noreferrer"><h3>${escape(r.title)} ↗</h3><p>${escape(r.detail)}</p></a>`).join('')}</div></div>`;

  default:return `<div class="body">${bullets(s)}</div>`;
 }}
 function footer(s,i){return `<footer class="slide-footer"><span class="footer-brand"><img src="assets/logo.svg" alt=""/>Клинический Компас</span><div class="source-chips">${(s.sources||[]).map(id=>sources.get(id)).filter(Boolean).map(src=>`<a href="${escape(src.url)}" target="_blank" rel="noreferrer" title="${escape(src.title+' · '+src.detail)}">${escape(sourceLabel(src))} ↗</a>`).join('')}</div><span class="slide-number">${String(i+1).padStart(2,'0')} / ${deck.slides.length}</span></footer>`;}
 stage.innerHTML=deck.slides.map((s,i)=>`<section class="slide ${escape(s.kind)}" id="slide-${i+1}" data-slide="${i}" aria-label="Слайд ${i+1}: ${escape(s.title)}">${s.kind==='hero'?'':`<header class="slide-header"><div class="eyebrow auto">${escape(s.eyebrow)}</div><h1 class="auto" style="--delay:100ms">${escape(s.title)}</h1></header>`}${visual(s,i)}${footer(s,i)}</section>`).join('');
 const slides=[...stage.querySelectorAll('.slide')];
 let index=Math.min(deck.slides.length-1,Math.max(0,Number(location.hash.slice(1))-1||0)),step=0;
 function size(){const availableW=innerWidth-44,availableH=innerHeight-104;stage.style.transform=`scale(${Math.min(availableW/1920,availableH/1080)})`;}
 function updateNotes(){const s=deck.slides[index];document.getElementById('notesContent').innerHTML=`<h2>${String(index+1).padStart(2,'0')}. ${escape(s.title)}</h2><h3>Ключевые тезисы</h3><p>${s.bullets.map(escape).join('<br><br>')}</p><h3>Слова спикера</h3><p>${escape(s.note)}</p><h3>Визуальная идея</h3><p>${escape(s.visual)}</p><h3>Анимация</h3><p>${escape(s.animation)}</p>${s.sources?`<h3>Источники</h3><div class="sources-note">${s.sources.map(id=>sources.get(id)).filter(Boolean).map(src=>`<a href="${escape(src.url)}" target="_blank" rel="noreferrer">${escape(src.title)}<br>${escape(src.detail)}</a>`).join('')}</div>`:''}`;}
 function render(){slides.forEach((sl,i)=>{sl.classList.toggle('active',i===index);sl.setAttribute('aria-hidden',String(i!==index));if(i===index){sl.querySelectorAll('[data-reveal]').forEach(el=>el.classList.toggle('build-hidden',Number(el.dataset.reveal)>step));sl.querySelectorAll('[data-focus]').forEach(el=>el.classList.toggle('active-focus',step>0&&Number(el.dataset.focus)===step));const first=sl.querySelector('.screen-primary'),second=sl.querySelector('.screen-secondary');if(first){first.classList.toggle('screen-active',step===0);second.classList.toggle('screen-active',step>0);}}});document.getElementById('counter').textContent=`${String(index+1).padStart(2,'0')} / ${deck.slides.length}`;const max=maxSteps[deck.slides[index].kind]||0;document.getElementById('stepStatus').textContent=max?`Шаг ${step+1}/${max+1}`:'';document.getElementById('nextLabel').textContent=step<max?'Раскрыть':index===deck.slides.length-1?'Сначала':'Далее';document.getElementById('progress').style.width=`${((index+1)/deck.slides.length)*100}%`;document.getElementById('announce').textContent=`Слайд ${index+1} из ${deck.slides.length}. ${deck.slides[index].title}. ${max?`Шаг ${step+1} из ${max+1}.`:''}`;history.replaceState(null,'',`#${index+1}`);updateNotes();}
 function go(i){index=Math.max(0,Math.min(deck.slides.length-1,i));step=0;render();}
 function next(skip=false){const max=maxSteps[deck.slides[index].kind]||0;if(!skip&&step<max){step++;render()}else go(index===deck.slides.length-1?0:index+1);}
 function previous(skip=false){if(!skip&&step>0){step--;render()}else go(index-1);}
 function fullscreen(){if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.();}
 document.getElementById('next').addEventListener('click',()=>next());document.getElementById('previous').addEventListener('click',()=>previous());document.getElementById('fullscreenButton').addEventListener('click',fullscreen);
 const demoVideo=document.getElementById('demoVideo');document.getElementById('videoButton').addEventListener('click',()=>demoVideo.showModal());demoVideo.addEventListener('close',()=>demoVideo.querySelector('video').pause());
 const notes=document.getElementById('notes');document.getElementById('notesButton').addEventListener('click',()=>notes.classList.toggle('open'));document.getElementById('notesClose').addEventListener('click',()=>notes.classList.remove('open'));
 const overview=document.getElementById('overview');function showOverview(){document.getElementById('overviewGrid').innerHTML=deck.slides.map((s,i)=>`<button class="overview-item ${i===index?'current':''}" data-jump="${i}"><span class="overview-num">${String(i+1).padStart(2,'0')}</span><strong>${escape(s.title)}</strong><small>${escape(s.eyebrow)}</small></button>`).join('');overview.showModal();}document.getElementById('overviewButton').addEventListener('click',showOverview);
 document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close)document.getElementById(close.dataset.close).close();const jump=e.target.closest('[data-jump]');if(jump){go(Number(jump.dataset.jump));overview.close()}const image=e.target.closest('[data-image]');if(image){document.getElementById('lightboxImage').src=image.dataset.image;document.getElementById('lightboxImage').alt=image.dataset.caption;document.getElementById('lightboxCaption').textContent=image.dataset.caption;document.getElementById('lightbox').showModal();}});
 document.querySelectorAll('dialog').forEach(dialog=>dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()}));
 document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]'))return;if(e.target.closest('input,textarea,select,[contenteditable="true"]'))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next(e.shiftKey)}else if(e.key==='ArrowLeft'){e.preventDefault();previous(e.shiftKey)}else if(e.key==='PageDown'){e.preventDefault();next(true)}else if(e.key==='PageUp'){e.preventDefault();previous(true)}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(deck.slides.length-1)}else if(e.key.toLowerCase()==='f'){e.preventDefault();fullscreen()}else if(e.key.toLowerCase()==='n'){e.preventDefault();notes.classList.toggle('open')}else if(e.key.toLowerCase()==='g'){e.preventDefault();showOverview()}else if(e.key==='Escape'){notes.classList.remove('open')}});
 window.addEventListener('resize',size);window.addEventListener('hashchange',()=>{const n=Number(location.hash.slice(1));if(n>=1&&n<=deck.slides.length&&n-1!==index)go(n-1)});
 const onPrint=()=>slides.forEach(sl=>sl.querySelectorAll('[data-reveal]').forEach(el=>el.classList.remove('build-hidden')));window.addEventListener('beforeprint',onPrint);window.addEventListener('afterprint',render);
 size();render();
})();
</script>
</body>
</html>
